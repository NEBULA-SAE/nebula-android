[package]
name = "nebula"
version = "2.0.21"
description = "NEBULA Oracle Terminal"
authors = ["NEBULA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
